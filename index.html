<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ═══════════════════════════════════════════════
         SEO BÁSICO
         NOTA: Actualizar canonical y og:url al dominio
         de producción real cuando esté disponible.
         Placeholder actual: https://la12digital.com
    ═══════════════════════════════════════════════ -->
    <title>La 12 Digital | Centro del hincha de Boca</title>
    <meta
      name="description"
      content="La 12 Digital es el centro del hincha de Boca Juniors. Próximos partidos, tabla de posiciones, noticias en tiempo real, clima en la Bombonera y más."
    />
    <meta
      name="keywords"
      content="Boca Juniors, La 12, fan site, fútbol argentino, próximos partidos, tabla de posiciones, noticias Boca, Bombonera"
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="La 12 Digital" />
    <link rel="canonical" href="https://la12digital.com" />

    <!-- ═══════════════════════════════════════════════
         OPEN GRAPH (Facebook, WhatsApp, LinkedIn)
    ═══════════════════════════════════════════════ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="La 12 Digital" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:url" content="https://la12digital.com" />
    <meta property="og:title" content="La 12 Digital | Fan Site Oficial de Boca Juniors" />
    <meta
      property="og:description"
      content="El centro del hincha de Boca Juniors. Partidos, posiciones, noticias, clima en la Bombonera y juegos interactivos — todo en tiempo real."
    />
    <meta property="og:image" content="https://la12digital.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="La 12 Digital — Fan Site de Boca Juniors" />

    <!-- ═══════════════════════════════════════════════
         TWITTER / X CARD
    ═══════════════════════════════════════════════ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@la12digital" />
    <meta name="twitter:title" content="La 12 Digital | Fan Site Oficial de Boca Juniors" />
    <meta
      name="twitter:description"
      content="El centro del hincha de Boca Juniors. Partidos, posiciones, noticias y más — todo en tiempo real."
    />
    <meta name="twitter:image" content="https://la12digital.com/og-image.png" />
    <meta name="twitter:image:alt" content="La 12 Digital — Fan Site de Boca Juniors" />

    <!-- ═══════════════════════════════════════════════
         ICONOS Y PWA
    ═══════════════════════════════════════════════ -->
    <link rel="icon" type="image/png" href="/escudo_boca.png" />
    <link rel="apple-touch-icon" href="/escudo_boca.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#001529" />

    <!-- ═══════════════════════════════════════════════
         PERFORMANCE: Preconnect a dominios externos
    ═══════════════════════════════════════════════ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preconnect a la API de Supabase (Auth/DB) -->
    <link rel="dns-prefetch" href="https://supabase.co" />

    <!-- Fuentes: display=swap garantiza text rendering sin FOIT -->
    <link
      href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;500;600;700&family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- ═══════════════════════════════════════════════
         STRUCTURED DATA — JSON-LD
         Organization + WebSite + SportsOrganization
         NOTA: Actualizar sameAs y urls al publicar.
    ═══════════════════════════════════════════════ -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://la12digital.com/#website",
            "url": "https://la12digital.com",
            "name": "La 12 Digital",
            "description": "Fan site oficial de Boca Juniors con información en tiempo real",
            "inLanguage": "es-AR",
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://la12digital.com/?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "Organization",
            "@id": "https://la12digital.com/#organization",
            "name": "La 12 Digital",
            "url": "https://la12digital.com",
            "logo": {
              "@type": "ImageObject",
              "url": "https://la12digital.com/escudo_boca.png",
              "width": 512,
              "height": 512
            },
            "description": "Fan site de Boca Juniors con partidos, posiciones, noticias y estadísticas en tiempo real",
            "inLanguage": "es-AR",
            "sameAs": ["https://twitter.com/la12digital"]
          },
          {
            "@type": "SportsOrganization",
            "@id": "https://la12digital.com/#boca-juniors",
            "name": "Club Atlético Boca Juniors",
            "alternateName": "Boca Juniors",
            "url": "https://www.bocajuniors.com.ar",
            "sport": "Football",
            "foundingDate": "1905",
            "location": {
              "@type": "Place",
              "name": "La Bombonera",
              "address": {
                "@type": "PostalAddress",
                "streetAddress": "Brandsen 805",
                "addressLocality": "Buenos Aires",
                "addressCountry": "AR"
              }
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
